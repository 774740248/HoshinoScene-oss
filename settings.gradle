// settings.gradle — 星野Scene 还原工程
// 工程声明 + 插件/依赖仓库集中管理
pluginManagement {
    repositories {
        // 国内镜像优先（本环境已预置 AGP 8.13.0 于 GRADLE_USER_HOME 缓存）
        maven { url 'https://mirrors.tencent.com/nexus/repository/maven-public/' }
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        maven { url 'https://mirrors.tencent.com/nexus/repository/maven-public/' }
        google()
        mavenCentral()
    }
}

rootProject.name = "hoshino-scene-recovered"
include ':app'
